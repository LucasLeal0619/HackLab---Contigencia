# CI do HackLab (HACKLAB-DEV-001, etapa 2): prova de compatibilidade com PostgreSQL antes de integrar em dev/main.
#
# - PostgreSQL 17 temporário no runner (serviço do job), banco hacklab_test + schema hacklab: o mesmo da produção.
# - Nada de produção: sem segredos do repositório, sem Supabase, sem Render/Netlify, sem deploy.
#   A APP_KEY é gerada no próprio job e descartada no fim.
# - Backend e frontend em jobs separados (resultado separado no PR).

name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel + PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: back

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hacklab
          POSTGRES_PASSWORD: hacklab-ci
          POSTGRES_DB: hacklab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hacklab -d hacklab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Variáveis reais têm precedência sobre o .env.testing (igual ao docker-compose de desenvolvimento).
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: hacklab
      DB_PASSWORD: hacklab-ci
      PGPASSWORD: hacklab-ci

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, intl, zip, bcmath, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('back/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Schema hacklab (como em docker/postgres/init e no Supabase)
        run: psql -h 127.0.0.1 -U hacklab -d hacklab_test -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS hacklab AUTHORIZATION hacklab;"

      - name: Ambiente de testes isolado
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing --force --no-interaction

      - name: Migrations do zero (hacklab_test) e conferência do banco
        run: |
          php artisan migrate:fresh --env=testing --force --no-interaction
          php artisan hacklab:db-check --env=testing

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: Testes do backend
        run: php artisan test --env=testing

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Backend (PostgreSQL 17)"
            echo "- PHP $(php -r 'echo PHP_VERSION;'), $(psql -h 127.0.0.1 -U hacklab -d hacklab_test -tAc 'show server_version' | cut -d' ' -f1)"
            echo "- migrations aplicadas: $(psql -h 127.0.0.1 -U hacklab -d hacklab_test -tAc 'select count(*) from hacklab.migrations' 2>/dev/null || echo '?')"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (Vue + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Dependências
        run: npm ci

      - name: Testes do frontend
        run: npm run test

      - name: Build de produção (sem VITE_API_URL, como no Netlify)
        run: npm run build
