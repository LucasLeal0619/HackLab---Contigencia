# Ambiente de DESENVOLVIMENTO e TESTES do HackLab.
#
#   docker compose up -d --build
#
# - app:      Laravel em http://localhost:8000 (código de ./back montado no container)
# - postgres: PostgreSQL 17 com os bancos hacklab_dev e hacklab_test (schema hacklab)
#
# O frontend Vue roda fora do Docker no desenvolvimento (cd front && npm run dev).
# Produção não usa este arquivo: API no Render, banco no Supabase, front como Static Site.

name: hacklab

services:
  app:
    build:
      context: ./back
      target: dev
    ports:
      # IPv4 e IPv6 locais: no Windows "localhost" tenta ::1 primeiro; só com 127.0.0.1 cada conexão
      # nova esperava ~2 s antes de cair para IPv4.
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    volumes:
      - ./back:/var/www/html
      # opcache de dev: revalida arquivos a cada PHP_OPCACHE_REVALIDATE_FREQ s (ver docker/php/dev.ini).
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-hacklab-dev.ini:ro
    environment:
      PHP_OPCACHE_REVALIDATE_FREQ: ${PHP_OPCACHE_REVALIDATE_FREQ:-30}
      # O servidor embutido do PHP atende 1 requisição por vez; com workers, as requisições paralelas de
      # uma tela não fazem fila. Só desenvolvimento.
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
      # Dentro da rede do Docker o PostgreSQL é o serviço "postgres" na porta 5432.
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hacklab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hacklab}
      POSTGRES_DB: hacklab_dev
      HACKLAB_TEST_DATABASE: hacklab_test
    ports:
      # Só na máquina local (DBeaver/pgAdmin). 5442 evita conflito com outros PostgreSQL (5432/5433).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hacklab_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
