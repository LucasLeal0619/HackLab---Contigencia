; PHP do target prod (sobre o php.ini-production oficial). Desenvolvimento não usa este arquivo.

; O código não muda dentro da imagem: o opcache não revalida arquivos.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

memory_limit = 256M
expose_php = Off

; Variáveis de ambiente do Render visíveis para o PHP (o padrão de produção, GPCS, omite $_ENV).
variables_order = "EGPCS"
