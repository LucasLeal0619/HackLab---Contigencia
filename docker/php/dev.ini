; PHP do container de DESENVOLVIMENTO (montado pelo docker-compose.yml; produção não usa este arquivo).
;
; O código de ./back chega ao container por uma montagem do Windows/macOS, onde cada stat() é caro.
; Com o padrão do opcache (revalidate_freq=2), a primeira requisição depois de 2 s revalida centenas de
; arquivos (vendor incluído) e custava ~2 s. Aqui a revalidação acontece no máximo a cada
; PHP_OPCACHE_REVALIDATE_FREQ segundos (padrão 30 no compose): uma edição em PHP pode levar até esse
; tempo para valer. Use 0 para revalidar sempre (mais lento) ou reinicie o container.
opcache.validate_timestamps = 1
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE_FREQ}
